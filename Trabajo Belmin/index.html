<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
            <div class="agrupacion">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="entrada" required>
            </div>

            <div class="agrupacion">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" class="entrada" required>
            </div>

            <div class="agrupacion">
                <label for="TipoDocumento">Tipo de documento:</label>
                <select id="TipoDocumento" name="TipoDocumento" class="form-select" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="cedula">Cédula de Ciudadanía</option>
                    <option value="pasaporte">Pasaporte</option>
                    <option value="TarjetaIdentidad">Tarjeta de Identidad</option>
                </select>
            </div>

            <div class="agrupacion">
                <label for="DNI">Número de documento:</label>
                <input type="text" id="DNI" name="DNI" class="entrada" pattern="[0-9]+" required>
            </div>

            <div class="agrupacion">
                <label for="NacimientoDate">Fecha de nacimiento:</label>
                <input type="date" id="NacimientoDate" name="NacimientoDate" class="entrada" required>
            </div>

            <div class="agrupacion">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" class="entrada" required>
            </div>

            <div class="form-radio-section">
                <p class="radio-title">¿Confirmas que tus datos son correctos?</p>
                
                <div class="radio-group">
                    <input type="radio" id="DatosSi" name="confirmacionDatos" value="si" class="form-radio" required>
                    <label for="DatosSi">Sí</label>
                </div>

                <div class="radio-group">
                    <input type="radio" id="DatosNo" name="confirmacionDatos" value="no" class="form-radio">
                    <label for="DatosNo">No</label>
                </div>
            </div>

            <button type="submit" class="form-btn">Enviar</button>
        </form>
    </div>

</body>
</html>
